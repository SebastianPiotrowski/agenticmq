[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenticmq"
version = "0.1.0"
description = "Lightweight Python SDK for AgenticMQ - token-aware AI agent queue broker"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agenticmq"]
